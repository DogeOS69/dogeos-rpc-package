# Testnet component versions and version-specific settings.
#
# docker-compose.yml extends every service from networks/${NETWORK}/compose.yml,
# so changing this file affects testnet only. Relative paths are resolved
# against this directory.
#
# Image versions (behavior documented for this network was checked against
# these versions):
#   dogecoin-node  Dogecoin Core 1.14.9
#   l2reth-node    DogeOS69/dogeos-rollup-node  v0.3.0-beta.1c  d3260afe
#   l1-interface   DogeOS L1 Interface          v0.3.0-beta.3d

services:
  dogecoin-node:
    image: dogeos69/dogecoin:1.14.9
    volumes:
      - type: bind
        source: ./dogecoin.conf
        target: /etc/dogeos/dogecoin.conf
        read_only: true
        bind:
          create_host_path: false
      # Docker volume named by DOGECOIN_VOLUME_NAME (declared in docker-compose.yml),
      # kept from earlier releases.
      - dogecoin_data:/data
    # Container ports are fixed by dogecoin.conf; DOGECOIN_RPC_PORT only changes
    # the RPC host port.
    # INTERNAL_BIND_ADDR is unset by default, publishing RPC on all interfaces
    # as earlier releases did.
    ports:
      # P2P stays on the port dogecoind listens on and advertises.
      - 44556:44556
      - ${INTERNAL_BIND_ADDR:+${INTERNAL_BIND_ADDR:-}:}${DOGECOIN_RPC_PORT:-44555}:44555

  l2reth-node:
    image: dogeos69/rollup-node:v0.3.0-beta.1c
    env_file:
      - ./l2reth.env
    environment:
      # rollup-node flags that depend on this image version. The entrypoint adds
      # the common ones (datadir, RPC, peers, L1 URL, blob archive).
      # --consensus.exit-on-signer-rotation exits with code 70 when the L1
      # authorized signer rotates; the restart policy starts the node again
      # with the new signer.
      L2RETH_NETWORK_ARGS: >-
        --network.scroll-wire=true
        --network.bridge=true
        --network.legacy-geth-header-transform true
        --txpool.pending-max-count=1000
        --builder.gaslimit=30000000
        --sequencer.max-l1-messages 51
        --engine.sync-at-startup false
        --consensus.exit-on-signer-rotation
        --l1.query-range 100
        --l1.liveness-threshold 2147483647
        --l1.liveness-check-interval 3600
    volumes:
      - type: bind
        source: ./l2reth-genesis.json
        target: /l2reth/genesis/genesis.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - ${L2_HTTP_PORT:-8545}:8545
      - ${L2_WS_PORT:-8546}:8546
      - ${L2_P2P_PORT:-30303}:30303/tcp
      - ${L2_P2P_PORT:-30303}:30303/udp
      - 127.0.0.1:${L2_METRICS_PORT:-6060}:6060

  l1-interface:
    image: dogeos69/l1-interface:v0.3.0-beta.3d
    env_file:
      - ./l1-interface.env
    environment:
      DOGEOS_RPC_PACKAGE_DOGECOIN_RPC_URL: http://dogecoin-node:44555
    ports:
      - ${INTERNAL_BIND_ADDR:+${INTERNAL_BIND_ADDR:-}:}8547:8545
      - ${INTERNAL_BIND_ADDR:+${INTERNAL_BIND_ADDR:-}:}5052:5052
      - ${INTERNAL_BIND_ADDR:+${INTERNAL_BIND_ADDR:-}:}9090:9090
    volumes:
      - type: bind
        source: ./l2reth-genesis.json
        target: /app/genesis/genesis.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./protocol_context.json
        target: /app/protocol_context.json
        read_only: true
        bind:
          create_host_path: false
    # Readiness of the database and replay read model: 503 during startup,
    # while reorg recovery is active, or after the replay pipeline stops.
    # (The legacy /health endpoint only reports that startup finished.)
    # Informational: L2Reth does not wait on it. The image has no curl.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /api/v1/health/ready HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      retries: 3
      # Initial sync on a new node can take hours; failures before the first
      # success are not counted.
      start_period: 12h

  l1-interface-init-fetch-sqlite:
    # One-time bootstrap of the pre-v0.3.0 testnet history; not a periodic snapshot.
    env_file:
      - ./l1-interface-bootstrap.env
